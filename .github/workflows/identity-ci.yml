name: E.Y.T Identity RBAC CI

on:
  push:
    branches: [main, feat/sprint-2-identity-production]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        env:
          JWT_SECRET: ci-only-jwt-secret
        run: python -m compileall api
      - name: Import production application
        env:
          JWT_SECRET: ci-only-jwt-secret
        run: python -c "from api.production.main import app; print(app.title)"

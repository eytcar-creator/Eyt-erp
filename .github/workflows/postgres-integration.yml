name: PostgreSQL Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eyt
          POSTGRES_PASSWORD: eyt
          POSTGRES_DB: eyt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eyt -d eyt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://eyt:eyt@localhost:5432/eyt_test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: eyt
      PGPASSWORD: eyt
      PGDATABASE: eyt_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" && exit 0
            sleep 2
          done
          exit 1

      - name: Verify pgcrypto
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto; SELECT gen_random_uuid();"

      - name: Apply canonical migrations in filename order
        run: |
          set -euo pipefail
          for migration in database/migrations/*.sql; do
            echo "==> $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify Order Center schema
        run: python scripts/verify_order_center_schema.py

      - name: Compile backend
        run: python -m compileall -q api

      - name: Run contract tests
        run: python -m pytest tests -q

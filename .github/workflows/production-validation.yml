name: E.Y.T Production Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall api scripts

      - name: Run tests
        run: pytest -q

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.production.yml config

      - name: Build ERP API image
        run: docker build -t eyt-erp-api:ci .

      - name: Build public catalog image
        run: docker build -t eyt-catalog:ci -f apps/eyt-catalog/Dockerfile .

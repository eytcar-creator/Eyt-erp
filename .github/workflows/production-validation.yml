name: E.Y.T Production Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall api scripts

      - name: Run non-database tests
        run: PYTHONPATH=. python -m pytest -q --ignore=tests/e2e --ignore=tests/test_order_center_postgres_integration.py

      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci_validation_password
          DATABASE_URL: postgresql://eyt_user:ci_validation_password@db:5432/eyt_erp
          JWT_SECRET: ci_jwt_secret_for_validation_only
          BOOTSTRAP_SECRET: ci_bootstrap_secret_for_validation_only
        run: docker compose -f docker-compose.production.yml config

      - name: Build ERP API image
        run: docker build -t eyt-erp-api:ci .

      - name: Build public catalog image
        run: docker build -t eyt-catalog:ci -f apps/eyt-catalog/Dockerfile .

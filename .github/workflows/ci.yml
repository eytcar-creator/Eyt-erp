name: E.Y.T ERP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eyt_user
          POSTGRES_PASSWORD: eyt_test
          POSTGRES_DB: eyt_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eyt_user -d eyt_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://eyt_user:eyt_test@localhost:5432/eyt_erp_test
      JWT_SECRET: ci-only-test-secret-change-me
      BOOTSTRAP_SECRET: ci-only-bootstrap-secret
      ACCESS_TOKEN_MINUTES: 15
      REFRESH_TOKEN_DAYS: 30
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt httpx
      - name: Verify SQL migration chain
        run: python scripts/verify_migration_chain.py
      - name: Verify Alembic migration chain
        run: python scripts/verify_alembic_chain.py
      - name: Verify SQL/Alembic compatibility
        run: python scripts/verify_migration_compatibility.py
      - name: Initialize PostgreSQL test schema
        run: |
          for migration in database/migrations/[0-9][0-9][0-9]_*.sql; do
            echo "Applying $migration"
            PGPASSWORD=eyt_test psql -h localhost -U eyt_user -d eyt_erp_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run tests
        run: pytest -q

  production-smoke:
    name: Production Compose Smoke
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: eyt_erp
      POSTGRES_USER: eyt_user
      POSTGRES_PASSWORD: eyt_smoke
      DATABASE_URL: postgresql://eyt_user:eyt_smoke@db:5432/eyt_erp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate production compose
        run: docker compose -f docker-compose.production.yml config
      - name: Build and start production stack
        run: docker compose -f docker-compose.production.yml up -d --build
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/ready; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "ERP readiness did not become healthy in time"
          docker compose -f docker-compose.production.yml ps
          docker compose -f docker-compose.production.yml logs --no-color api db catalog
          exit 1
      - name: Check customer catalog portal
        run: curl --fail --silent --show-error http://localhost:8080/ | grep -q "پرتال مشتری E.Y.T"
      - name: Check portal API proxy
        run: curl --fail --silent --show-error http://localhost:8080/api/health
      - name: Run operational smoke test
        run: BASE_URL=http://localhost:8000 python scripts/operational_smoke_test.py
      - name: Show service status
        if: always()
        run: docker compose -f docker-compose.production.yml ps
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.production.yml logs --no-color api db catalog
      - name: Tear down production stack
        if: always()
        run: docker compose -f docker-compose.production.yml down -v

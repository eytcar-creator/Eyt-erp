name: E.Y.T ERP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eyt_user
          POSTGRES_PASSWORD: eyt_test
          POSTGRES_DB: eyt_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eyt_user -d eyt_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://eyt_user:eyt_test@localhost:5432/eyt_erp_test
      JWT_SECRET: ci-only-test-secret-change-me
      BOOTSTRAP_SECRET: ci-only-bootstrap-secret
      ACCESS_TOKEN_MINUTES: 15
      REFRESH_TOKEN_DAYS: 30
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

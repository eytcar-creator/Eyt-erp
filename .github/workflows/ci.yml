name: E.Y.T ERP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eyt_user
          POSTGRES_PASSWORD: eyt_test
          POSTGRES_DB: eyt_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eyt_user -d eyt_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://eyt_user:eyt_test@localhost:5432/eyt_erp_test
      JWT_SECRET: ci-only-test-secret-change-me
      BOOTSTRAP_SECRET: ci-only-bootstrap-secret
      ACCESS_TOKEN_MINUTES: 15
      REFRESH_TOKEN_DAYS: 30
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt httpx
      - name: Verify migration chain
        run: python scripts/verify_migration_chain.py
      - name: Initialize PostgreSQL test schema
        run: |
          PGPASSWORD=eyt_test psql -h localhost -U eyt_user -d eyt_erp_test -v ON_ERROR_STOP=1 -f database/migrations/001_production_core.sql
          PGPASSWORD=eyt_test psql -h localhost -U eyt_user -d eyt_erp_test -v ON_ERROR_STOP=1 -f database/migrations/002_production_indexes.sql
          PGPASSWORD=eyt_test psql -h localhost -U eyt_user -d eyt_erp_test -v ON_ERROR_STOP=1 -f database/migrations/003_identity_rbac.sql
          PGPASSWORD=eyt_test psql -h localhost -U eyt_user -d eyt_erp_test -v ON_ERROR_STOP=1 -f database/migrations/004_product_master_inventory.sql
          PGPASSWORD=eyt_test psql -h localhost -U eyt_user -d eyt_erp_test -v ON_ERROR_STOP=1 -f database/migrations/005_purchase_receiving.sql
      - name: Run tests
        run: pytest -q

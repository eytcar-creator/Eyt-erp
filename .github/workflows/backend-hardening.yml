name: Backend Hardening

on:
  push:
    branches:
      - main
      - feat/backend-production-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-hardening:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eyt_user
          POSTGRES_PASSWORD: eyt_test
          POSTGRES_DB: eyt_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eyt_user -d eyt_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://eyt_user:eyt_test@localhost:5432/eyt_erp_test
      JWT_SECRET: ci-only-test-secret-change-me
      BOOTSTRAP_SECRET: ci-only-bootstrap-secret
      ACCESS_TOKEN_MINUTES: 15
      REFRESH_TOKEN_DAYS: 30
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi
          if [ -f api/requirements-dev.txt ]; then pip install -r api/requirements-dev.txt; fi
          python -m pip install pytest

      - name: Initialize PostgreSQL test schema
        run: |
          set -euo pipefail
          for migration in database/migrations/*.sql; do
            echo "Applying $migration"
            PGPASSWORD=eyt_test psql -h localhost -U eyt_user -d eyt_erp_test -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Compile check
        run: python -m compileall -q api

      - name: Run tests when present
        run: |
          if [ -d api/tests ]; then
            python -m pytest api/tests -q
          fi
          if [ -d tests ]; then
            python -m pytest tests -q
          fi
          if [ ! -d api/tests ] && [ ! -d tests ]; then
            echo 'No test directories present; compile check passed.'
          fi

name: Backend Hardening

on:
  push:
    branches:
      - main
      - feat/backend-production-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi
          if [ -f api/requirements-dev.txt ]; then pip install -r api/requirements-dev.txt; fi
          python -m pip install pytest

      - name: Compile check
        run: python -m compileall -q api

      - name: Run tests when present
        run: |
          if [ -d api/tests ]; then
            python -m pytest api/tests -q
          fi
          if [ -d tests ]; then
            python -m pytest tests -q
          fi
          if [ ! -d api/tests ] && [ ! -d tests ]; then
            echo 'No test directories present; compile check passed.'
          fi

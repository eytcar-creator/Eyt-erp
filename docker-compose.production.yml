services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eyt_erp}
      POSTGRES_USER: ${POSTGRES_USER:-eyt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - eyt_postgres:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build: .
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "scripts/migrate_production.py"]

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:?BOOTSTRAP_SECRET must be set}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      CHANNEL_INTAKE_SECRET: ${CHANNEL_INTAKE_SECRET:-}
      RUBIKA_WORKSHOP_WEBHOOK_SECRET: ${RUBIKA_WORKSHOP_WEBHOOK_SECRET:?RUBIKA_WORKSHOP_WEBHOOK_SECRET must be set}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  finance-worker:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      FINANCE_NOTIFICATION_WORKER_ID: ${FINANCE_NOTIFICATION_WORKER_ID:-finance-worker-01}
      FINANCE_SETTLEMENT_ALERT_CHANNEL: ${FINANCE_SETTLEMENT_ALERT_CHANNEL:-EMAIL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["sh", "-c", "while true; do python scripts/run_finance_alert_sync.py; python scripts/run_finance_notification_worker.py --limit 25; sleep 60; done"]
    healthcheck:
      test: ["CMD-SHELL", "python scripts/check_finance_notification_health.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  catalog:
    build:
      context: .
      dockerfile: apps/eyt-catalog/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  n8n:
    image: n8nio/n8n:latest
    profiles: ["automation"]
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-n8n.localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set}
      EYT_ERP_API_BASE_URL: ${EYT_ERP_API_BASE_URL:-http://api:8000}
      EYT_ERP_CHANNEL_TOKEN: ${EYT_ERP_CHANNEL_TOKEN:?EYT_ERP_CHANNEL_TOKEN must be set}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Tehran}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation/n8n/workflows:/workflows:ro

volumes:
  eyt_postgres:
  n8n_data:

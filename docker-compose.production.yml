services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eyt_erp
      POSTGRES_USER: eyt_user
      POSTGRES_PASSWORD: change_me
    volumes:
      - eyt_postgres:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eyt_user -d eyt_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://eyt_user:change_me@db:5432/eyt_erp
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  eyt_postgres:

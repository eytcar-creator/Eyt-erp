<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E.Y.T | Repeat Purchase CRM</title><style>body{font-family:Tahoma,Arial;background:#f5f7fa;color:#172033;margin:0}.head{background:#17243a;color:white;padding:18px}.wrap{max-width:1300px;margin:auto;padding:18px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.k{background:white;border:1px solid #e5e9ef;border-radius:14px;padding:15px;margin-bottom:14px}.k b{display:block;font-size:25px;margin-top:6px}.muted{color:#718096;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{border:0;border-radius:9px;padding:9px 13px;background:#17243a;color:white;cursor:pointer}.danger{background:#b51224}.ok{background:#15803d}table{width:100%;border-collapse:collapse;background:white}th,td{padding:10px;border-bottom:1px solid #e5e9ef;text-align:right;font-size:13px}th{background:#f8fafc}.tag{background:#eef2f7;border-radius:999px;padding:4px 8px;font-size:11px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.cards{grid-template-columns:1fr}}</style><body><div class="head"><b>E.Y.T Repeat Purchase CRM</b><div class="muted">پیگیری خرید مجدد و تبدیل مشتری قبلی به فروش بعدی</div></div><div class="wrap"><div id="summary" class="cards"></div><div class="card"><div class="toolbar"><button onclick="load()">↻ بروزرسانی</button><button onclick="load('OVERDUE')">فقط عقب‌افتاده‌ها</button><button class="ok" onclick="load('OPEN')">همه فرصت‌های باز</button></div><div class="muted">هر ردیف یک فرصت فروش مجدد است. تماس ثبت‌شده، سفارش بعدی و نتیجه پیگیری باید در همین چرخه ثبت شود.</div></div><div class="card"><div style="overflow:auto"><table><thead><tr><th>سررسید</th><th>مشتری</th><th>موبایل</th><th>قطعه</th><th>عقب‌افتادگی</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>const API=(localStorage.getItem('EYT_API_BASE')||location.origin).replace(/\/$/,'');async function api(p,o={}){let r=await fetch(API+p,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw Error(await r.text());return r.json()}async function load(mode){try{let s=await api('/api/v1/repeat-purchase/summary');document.getElementById('summary').innerHTML=[['باز',s.open],['عقب‌افتاده',s.overdue],['امروز',s.dueToday],['۳۰ روز آینده',s.due30Days],['مشتری',s.customers]].map(x=>`<div class=k><span class=muted>${x[0]}</span><b>${Number(x[1]).toLocaleString('fa-IR')}</b></div>`).join('');let p=mode==='OVERDUE'?'&overdue_only=true':'';let d=await api('/api/v1/repeat-purchase/opportunities?status=OPEN'+p);document.getElementById('rows').innerHTML=d.map(x=>`<tr><td>${x.dueDate}</td><td>${x.customerName}<br><span class=tag>${x.customerCode}</span></td><td>${x.phone||'-'}</td><td>${x.productCode}<br>${x.productName}</td><td>${x.daysOverdue?x.daysOverdue+' روز':'-'}</td><td><button onclick="contact('${x.id}')">ثبت تماس</button></td></tr>`).join('')||'<tr><td colspan=6 style="text-align:center;padding:30px">فرصت فعالی وجود ندارد</td></tr>'}catch(e){document.getElementById('rows').innerHTML='<tr><td colspan=6>'+e.message+'</td></tr>'}}async function contact(id){let c=prompt('کانال تماس: تلفن / واتساپ / پیامک','تلفن');if(c===null)return;try{await api('/api/v1/repeat-purchase/'+id+'/contact',{method:'POST',body:JSON.stringify({channel:c})});await load()}catch(e){alert(e.message)}}load()</script></body></html>

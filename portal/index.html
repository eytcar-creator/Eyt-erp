<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E.Y.T ERP</title><style>body{font-family:Tahoma,Arial;margin:0;background:#f4f6f8;color:#17212b}header{background:#17212b;color:#fff;padding:18px}.wrap{max-width:1200px;margin:auto;padding:24px}.panel{background:#fff;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 1px 6px #0001}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{padding:18px;border:1px solid #eee;border-radius:10px}.value{font-size:26px;font-weight:bold;margin-top:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button,button{padding:10px 14px;border:0;border-radius:8px;background:#198754;color:white;cursor:pointer}input{width:100%;box-sizing:border-box;padding:11px;margin:7px 0;border:1px solid #ccd3da;border-radius:7px}.login{max-width:420px;margin:80px auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;text-align:right}.error{color:#b42318}.hidden{display:none}</style></head><body><header><strong>E.Y.T ERP</strong> <span>سامانه عملیاتی شرکت E.Y.T</span></header><div id="login" class="panel login"><h2>ورود به E.Y.T ERP</h2><input id="username" placeholder="نام کاربری"><input id="password" type="password" placeholder="رمز عبور"><button onclick="login()">ورود</button><p id="err" class="error"></p></div><main id="app" class="wrap hidden"><div class="panel"><h2>داشبورد</h2><div id="cards" class="cards"></div></div><div class="panel"><div class="toolbar"><button onclick="products()">کاتالوگ محصولات</button><button onclick="inventory()">موجودی انبار</button><button onclick="logout()">خروج</button></div><div id="content"></div></div></main><script>const API='/api/v1';let token=localStorage.getItem('eyt_token');const H=()=>({Authorization:'Bearer '+token,'Content-Type':'application/json'});async function login(){let r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});if(!r.ok){err.textContent='نام کاربری یا رمز عبور نادرست است';return}let d=await r.json();token=d.access_token;localStorage.setItem('eyt_token',token);show()}async function show(){let r=await fetch(API+'/auth/me',{headers:H()});if(!r.ok){logout();return}loginPanel(false);dashboard()}function loginPanel(v){document.getElementById('login').classList.toggle('hidden',!v);document.getElementById('app').classList.toggle('hidden',v)}async function dashboard(){let r=await fetch(API+'/dashboard/summary',{headers:H()});let d=await r.json();cards.innerHTML=Object.entries(d).map(([k,v])=>'<div class="card"><div>'+k+'</div><div class="value">'+v+'</div></div>').join('')}async function products(){let r=await fetch(API+'/products',{headers:H()});let d=await r.json();content.innerHTML='<h3>محصولات</h3><table><tr><th>SKU</th><th>نام</th><th>OEM</th><th>برند</th><th>قیمت فروش</th></tr>'+d.map(x=>'<tr><td>'+x.sku+'</td><td>'+x.name_fa+'</td><td>'+String(x.oem_code||'')+'</td><td>'+String(x.brand||'')+'</td><td>'+x.sale_price+'</td></tr>').join('')+'</table>'}async function inventory(){let r=await fetch(API+'/inventory',{headers:H()});let d=await r.json();content.innerHTML='<h3>موجودی</h3><table><tr><th>SKU</th><th>محصول</th><th>انبار</th><th>موجودی</th><th>قابل مصرف</th></tr>'+d.map(x=>'<tr><td>'+x.sku+'</td><td>'+x.name_fa+'</td><td>'+x.warehouse_code+'</td><td>'+x.on_hand_qty+'</td><td>'+x.available_qty+'</td></tr>').join('')+'</table>'}function logout(){token=null;localStorage.removeItem('eyt_token');loginPanel(true)}if(token)show();else loginPanel(true)</script></body></html>

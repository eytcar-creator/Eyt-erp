<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E.Y.T | کنترل تولید</title><style>:root{font-family:Tahoma,Arial,sans-serif;color:#17202a;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.top{background:#111827;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:21px}.wrap{max-width:1250px;margin:20px auto;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;box-shadow:0 2px 8px #0000000b}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.field label{display:block;font-size:12px;color:#6b7280;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;background:#fff}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.ok{color:#047857}.muted{color:#6b7280;font-size:13px}.table{width:100%;border-collapse:collapse;margin-top:10px}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:right;font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff}.hidden{display:none}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.msg{margin-top:10px;padding:9px;border-radius:8px;background:#f3f4f6;white-space:pre-wrap}.op{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:8px}.small{font-size:12px}@media(max-width:650px){.table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><header class="top"><div class="brand">E.Y.T ERP · کنترل تولید</div><div id="who" class="small">مهمان</div></header><main class="wrap">
<section id="login" class="card"><h2>ورود امن</h2><p class="muted">توکن از API گرفته می‌شود؛ دیگر خبری از رمزهای ۱۲۳۴ داخل HTML نیست.</p><div class="row"><div class="field"><label>نام کاربری</label><input id="username" autocomplete="username"></div><div class="field"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"></div></div><div class="actions"><button class="btn primary" onclick="login()">ورود</button></div><div id="loginMsg" class="msg hidden"></div></section>
<section id="app" class="hidden"><div class="grid"><div class="card"><div class="muted">وضعیت API</div><b id="health">—</b></div><div class="card"><div class="muted">کاربر</div><b id="user">—</b></div><div class="card"><div class="muted">دسترسی‌ها</div><b id="perms">—</b></div></div>
<div class="card" style="margin-top:12px"><h2>Production Order</h2><div class="row"><div class="field"><label>شماره سفارش</label><input id="orderNo" placeholder="PO-2026-0001"></div><div class="field"><label>کد محصول</label><input id="productCode" placeholder="EYT-..."></div><div class="field"><label>نام محصول</label><input id="productName" placeholder="سیبک فرمان آریو"></div><div class="field"><label>تعداد</label><input id="qty" type="number" min="0.001" step="0.001"></div><div class="field"><label>تاریخ</label><input id="orderDate" type="date"></div></div><div class="actions"><button class="btn primary" onclick="createOrder()">ایجاد سفارش تولید</button><button class="btn secondary" onclick="loadOrder()">بارگذاری سفارش</button><button class="btn danger" onclick="logout()">خروج</button></div><div id="orderMsg" class="msg hidden"></div></div>
<div id="orderCard" class="card hidden" style="margin-top:12px"><h2 id="orderTitle">سفارش</h2><div id="orderInfo" class="muted"></div><h3>Routing / عملیات</h3><div id="ops"></div><div class="card" style="margin-top:12px"><h3>ثبت عملیات</h3><div class="row"><div class="field"><label>کد عملیات</label><input id="opCode" placeholder="OP-020"></div><div class="field"><label>شماره ترتیب</label><input id="seq" type="number" min="1"></div><div class="field"><label>نام عملیات</label><input id="opName" placeholder="فورج"></div><div class="field"><label>پیمانکار</label><input id="contractor"></div><div class="field"><label>ورودی</label><input id="inputQty" type="number" min="0" step="0.001"></div><div class="field"><label>سالم</label><input id="accepted" type="number" min="0" step="0.001"></div><div class="field"><label>مردود</label><input id="rejected" type="number" min="0" step="0.001" value="0"></div><div class="field"><label>ضایعات</label><input id="waste" type="number" min="0" step="0.001" value="0"></div><div class="field"><label>هزینه خدمات</label><input id="serviceCost" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>حمل</label><input id="transportCost" type="number" min="0" step="0.01" value="0"></div></div><div class="actions"><button class="btn secondary" onclick="startOp()">شروع عملیات</button><button class="btn primary" onclick="completeOp()">ثبت پایان عملیات</button></div><div id="opMsg" class="msg hidden"></div></div></div>
<div class="card" style="margin-top:12px"><h2>QC و Traceability</h2><div class="row"><div class="field"><label>Batch No</label><input id="batchNo" placeholder="B-2026-0001"></div><div class="field"><label>نوع بازرسی</label><input id="inspectionType" value="FINAL"></div><div class="field"><label>بازرس</label><input id="inspector"></div><div class="field"><label>نتیجه</label><select id="result"><option>PASS</option><option>FAIL</option><option>CONDITIONAL</option></select></div><div class="field"><label>سالم</label><input id="qcAccepted" type="number" min="0" step="0.001"></div><div class="field"><label>مردود</label><input id="qcRejected" type="number" min="0" step="0.001"></div></div><div class="actions"><button class="btn secondary" onclick="createBatch()">ساخت Batch QC</button><button class="btn primary" onclick="inspect()">ثبت بازرسی</button><button class="btn secondary" onclick="trace()">نمایش Trace</button></div><div id="qcMsg" class="msg hidden"></div></div></section></main>
<script>const API='';let access=localStorage.getItem('eyt_access')||'',refresh=localStorage.getItem('eyt_refresh')||'',current='';const $=id=>document.getElementById(id);const msg=(id,t,good=false)=>{$(id).textContent=t;$(id).className='msg '+(good?'ok':'')};async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(access?{Authorization:'Bearer '+access}:{})};let r=await fetch(API+path,opt);if(r.status===401&&refresh){const x=await fetch('/api/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refresh})});if(x.ok){const d=await x.json();access=d.access_token;refresh=d.refresh_token;localStorage.setItem('eyt_access',access);localStorage.setItem('eyt_refresh',refresh);opt.headers.Authorization='Bearer '+access;r=await fetch(API+path,opt)}}const text=await r.text();let d;try{d=JSON.parse(text)}catch{d={detail:text}}if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}async function login(){try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.detail||'ورود ناموفق');access=d.access_token;refresh=d.refresh_token;localStorage.setItem('eyt_access',access);localStorage.setItem('eyt_refresh',refresh);await boot()}catch(e){msg('loginMsg',e.message)}}async function boot(){try{const me=await api('/api/auth/me');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=me.username;$('user').textContent=me.username;$('perms').textContent=(me.permissions||[]).join('، ')||'بدون دسترسی';const h=await fetch('/health');$('health').textContent=h.ok?'فعال':'خطا';$('orderDate').value=new Date().toLocaleDateString('en-CA');}catch(e){localStorage.clear();access='';refresh='';$('app').classList.add('hidden');$('login').classList.remove('hidden');msg('loginMsg',e.message)}}async function logout(){if(refresh)try{await api('/api/auth/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refresh})})}catch{}localStorage.clear();location.reload()}async function createOrder(){try{const d=await api('/api/production/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_no:$('orderNo').value.trim(),product_code:$('productCode').value.trim(),product_name:$('productName').value.trim(),target_qty:Number($('qty').value),order_date:$('orderDate').value})});msg('orderMsg','سفارش ایجاد شد: '+d.orderNo,true);await loadOrder()}catch(e){msg('orderMsg',e.message)}}async function loadOrder(){try{current=$('orderNo').value.trim();if(!current)throw Error('شماره سفارش را وارد کنید');const d=await api('/api/production/orders/'+encodeURIComponent(current));$('orderCard').classList.remove('hidden');$('orderTitle').textContent=d.order.order_no+' · '+d.order.product_name;$('orderInfo').textContent='تعداد: '+d.order.target_qty+' | وضعیت: '+d.order.status+' | محصول: '+d.order.product_code;renderOps(d.operations)}catch(e){msg('orderMsg',e.message)}}function renderOps(ops){$('ops').innerHTML=ops.length?ops.map(o=>`<div class="op"><b>${o.sequence_no}. ${o.operation_code} · ${o.operation_name}</b><div class="small">پیمانکار: ${o.contractor_name||'—'} | وضعیت: ${o.status} | ورودی ${o.input_qty||0} | سالم ${o.accepted_qty||0} | مردود ${o.rejected_qty||0} | ضایعات ${o.waste_qty||0} | خدمات ${o.service_cost||0}</div></div>`).join(''):'<div class="muted">هنوز عملیاتی ثبت نشده است.</div>'}async function startOp(){try{const c=$('opCode').value.trim();const d=await api('/api/production/orders/'+encodeURIComponent(current||$('orderNo').value.trim())+'/operations/'+encodeURIComponent(c)+'/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sequenceNo:Number($('seq').value),operationCode:c,operationName:$('opName').value.trim(),contractorName:$('contractor').value.trim()||null})});msg('opMsg','عملیات شروع شد: '+d.operationCode,true);await loadOrder()}catch(e){msg('opMsg',e.message)}}async function completeOp(){try{const order=current||$('orderNo').value.trim(),c=$('opCode').value.trim();const input=Number($('inputQty').value),a=Number($('accepted').value),r=Number($('rejected').value),w=Number($('waste').value);if(a+r+w!==input)throw Error('سالم + مردود + ضایعات باید دقیقاً برابر ورودی باشد');const d=await api('/api/production/orders/'+encodeURIComponent(order)+'/operations/'+encodeURIComponent(c)+'/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sequenceNo:Number($('seq').value),operationCode:c,operationName:$('opName').value.trim(),inputQty:input,acceptedQty:a,rejectedQty:r,wasteQty:w,serviceCost:Number($('serviceCost').value),transportCost:Number($('transportCost').value),contractorName:$('contractor').value.trim()||null})});msg('opMsg','عملیات تکمیل شد: '+d.operationCode,true);await loadOrder()}catch(e){msg('opMsg',e.message)}}async function createBatch(){try{const d=await api('/api/qc/batches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_no:$('batchNo').value.trim(),production_order_no:current||$('orderNo').value.trim(),product_code:$('productCode').value.trim(),planned_qty:Number($('qty').value)})});msg('qcMsg','Batch ساخته شد: '+d.batch_no,true)}catch(e){msg('qcMsg',e.message)}}async function inspect(){try{const b=$('batchNo').value.trim(),d=await api('/api/qc/batches/'+encodeURIComponent(b)+'/inspect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({inspection_type:$('inspectionType').value,result:$('result').value,inspector:$('inspector').value.trim(),accepted_qty:Number($('qcAccepted').value),rejected_qty:Number($('qcRejected').value)})});msg('qcMsg','بازرسی ثبت شد. وضعیت: '+d.batch.status,true)}catch(e){msg('qcMsg',e.message)}}async function trace(){try{const d=await api('/api/qc/trace/'+encodeURIComponent($('batchNo').value.trim()));msg('qcMsg',d.events.map(x=>new Date(x.event_at).toLocaleString('fa-IR')+' · '+x.event_type+' · '+(x.actor||'')).join('\n')||'بدون رویداد',true)}catch(e){msg('qcMsg',e.message)}}boot();</script></body></html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E.Y.T ERP | Production Workflow</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;margin:0;background:#f4f6f8;color:#17202a}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.steps{display:flex;gap:8px;overflow:auto;margin:18px 0}.step{padding:10px 14px;border-radius:10px;background:#fff;border:1px solid #d8dee4;white-space:nowrap}.step.active{border-color:#111;background:#111;color:#fff}.card{background:#fff;border:1px solid #d8dee4;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #00000008}h1{margin:0;font-size:22px}h2{font-size:18px;margin-top:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:bold}input,select,textarea{padding:10px;border:1px solid #cbd3da;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:#111;color:#fff}.secondary{background:#e9ecef;color:#111}.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.status{padding:10px;border-radius:8px;background:#f1f3f5;white-space:pre-wrap}.hidden{display:none}.ok{background:#e7f5e9}.bad{background:#fdecec}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:right}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>فرم عملیاتی تولید E.Y.T</h1><div>از خرید ماده اولیه تا ورود محصول سالم به انبار</div></div><div id="apiState" class="status">API: آماده</div></div>
<div class="steps" id="steps"></div><main id="app"></main>
</div>
<script>
const steps=[['purchase','۱. خرید مواد'],['receive','۲. دریافت و کنترل'],['reserve','۳. رزرو مواد'],['order','۴. Production Order'],['operations','۵. عملیات تولید'],['qc','۶. QC'],['finish','۷. محصول نهایی'],['warehouse','۸. ورود به انبار']];
let current=0; let state={orderNo:'PO-ARIO-0001',productCode:'EYT-ARIO-TIE-ROD',productName:'سیبک فرمان آریو',targetQty:2000,material:'CK45 Ø24',materialQty:2100,goodQty:0,scrapQty:0};
const app=document.getElementById('app'); const stepsEl=document.getElementById('steps');
function nav(){stepsEl.innerHTML=steps.map((s,i)=>`<button class="step ${i===current?'active':''}" onclick="go(${i})">${s[1]}</button>`).join(''); render();}
function go(i){current=i;nav()}
function field(id,label,val='',type='text'){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${val}"></div>`}
function actions(next=true){return `<div class="actions"><button onclick="saveStep()">ثبت مرحله</button>${next?'<button class="secondary" onclick="go(current+1)">مرحله بعد</button>':''}</div><div id="msg" class="status hidden"></div>`}
function render(){const common=`<div class="card"><h2>ردیابی سفارش</h2><div class="grid">${field('orderNo','شماره سفارش تولید',state.orderNo)}${field('productCode','کد محصول',state.productCode)}${field('productName','نام محصول',state.productName)}${field('targetQty','تعداد هدف',state.targetQty,'number')}</div></div>`;
let html=common;
if(current===0) html+=`<div class="card"><h2>خرید ماده اولیه</h2><div class="grid">${field('supplier','تأمین‌کننده','')} ${field('material','ماده اولیه',state.material)} ${field('qty','مقدار خرید',state.materialQty,'number')} ${field('unitCost','قیمت واحد','0','number')} ${field('invoice','شماره فاکتور','')} ${field('lot','Lot/Batch','')}</div>${actions()}</div>`;
if(current===1) html+=`<div class="card"><h2>دریافت و کنترل ورودی</h2><div class="grid">${field('received','مقدار دریافتی',state.materialQty,'number')}${field('accepted','مقدار تأییدشده',state.materialQty,'number')}${field('rejected','مقدار مردود','0','number')}${field('warehouse','انبار','MAIN')}</div><textarea id="receiveNote" class="field full" placeholder="نتیجه کنترل، شماره بارنامه، توضیحات..."></textarea>${actions()}</div>`;
if(current===2) html+=`<div class="card"><h2>رزرو مواد برای Production Order</h2><table class="table"><tr><th>ماده</th><th>نیاز BOM</th><th>موجود</th><th>رزرو</th><th>وضعیت</th></tr><tr><td>${state.material}</td><td>${state.targetQty}</td><td>${state.materialQty}</td><td><input id="reserveQty" type="number" value="${state.targetQty}"></td><td>قابل رزرو</td></tr></table>${actions()}</div>`;
if(current===3) html+=`<div class="card"><h2>ایجاد Production Order</h2><div class="grid">${field('plannedStart','شروع برنامه','2026-09-04','date')}${field('plannedEnd','پایان برنامه','2026-09-05','date')}${field('warehouse','انبار محصول','MAIN')}${field('bomVersion','نسخه BOM','BOM-ARIO-01')}</div><div class="status">Routing: فورج → سوراخکاری → CNC → رزوه‌زنی → آبکاری → مونتاژ → QC → بسته‌بندی</div>${actions()}</div>`;
if(current===4) html+=`<div class="card"><h2>ثبت عملیات تولید</h2><table class="table"><tr><th>عملیات</th><th>ورودی</th><th>سالم</th><th>مردود</th><th>ضایعات</th><th>هزینه خدمات</th></tr>${['فورج','سوراخکاری','CNC','رزوه‌زنی','آبکاری','مونتاژ'].map((x,i)=>`<tr><td>${x}</td><td><input id="in${i}" type="number" value="${state.targetQty}"></td><td><input id="ok${i}" type="number" value="${state.targetQty}"></td><td><input id="rej${i}" type="number" value="0"></td><td><input id="scr${i}" type="number" value="0"></td><td><input id="cost${i}" type="number" value="0"></td></tr>`).join('')}</table><div class="actions"><button onclick="completeOperations()">ثبت عملیات و ضایعات</button></div><div id="msg" class="status hidden"></div></div>`;
if(current===5) html+=`<div class="card"><h2>کنترل کیفیت نهایی</h2><div class="grid">${field('inspectedQty','تعداد بازرسی',state.targetQty,'number')}${field('acceptedQty','تأییدشده',state.targetQty,'number')}${field('rejectedQty','مردود','0','number')}${field('reportNo','شماره گزارش','QC-0001')}</div><div class="grid">${field('inspector','بازرس','')}${field('result','نتیجه','pass')}</div><textarea id="qcNote" class="field full" placeholder="معیارها، اندازه‌گیری‌ها و توضیحات"></textarea>${actions()}</div>`;
if(current===6) html+=`<div class="card"><h2>تأیید محصول نهایی</h2><div class="grid">${field('goodQty','تعداد سالم',state.goodQty,'number')}${field('scrapQty','ضایعات نهایی',state.scrapQty,'number')}${field('batch','Batch محصول','FG-ARIO-0001')}${field('actualCost','هزینه واقعی کل','0','number')}</div><div class="status">محصول فقط پس از QC موفق قابل انتقال به انبار کالای ساخته‌شده است.</div>${actions()}</div>`;
if(current===7) html+=`<div class="card"><h2>رسید ورود به انبار محصول</h2><div class="grid">${field('fgWarehouse','انبار مقصد','MAIN')}${field('fgQty','مقدار ورود',state.goodQty,'number')}${field('location','مکان','FG-A-01')}${field('receiptNo','شماره رسید','GRN-FG-0001')}</div><div class="status ok">پس از ثبت، موجودی محصول نهایی افزایش و سفارش تولید بسته می‌شود.</div>${actions(false)}</div>`;
app.innerHTML=html}
function show(text,ok=true){const m=document.getElementById('msg');if(m){m.textContent=text;m.className='status '+(ok?'ok':'bad')}}
function saveStep(){state.orderNo=document.getElementById('orderNo')?.value||state.orderNo;state.productCode=document.getElementById('productCode')?.value||state.productCode;state.productName=document.getElementById('productName')?.value||state.productName;state.targetQty=Number(document.getElementById('targetQty')?.value||state.targetQty);show('مرحله در فرم ثبت شد. برای اتصال به API، درخواست عملیاتی از همین رکورد ساخته می‌شود.');}
async function api(path,method,body){const r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error(await r.text());return r.json().catch(()=>({ok:true}))}
async function completeOperations(){try{for(let i=0;i<6;i++){const input=Number(document.getElementById('in'+i).value),accepted=Number(document.getElementById('ok'+i).value),rejected=Number(document.getElementById('rej'+i).value),waste=Number(document.getElementById('scr'+i).value),cost=Number(document.getElementById('cost'+i).value);await api(`/production/orders/${encodeURIComponent(state.orderNo)}/operations/OP${(i+1)*10}/complete`,'POST',{inputQty:input,acceptedQty:accepted,rejectedQty:rejected,wasteQty:waste,serviceCost:cost});state.goodQty=accepted;state.scrapQty+=rejected+waste}show('عملیات تولید و ضایعات با موفقیت به API ارسال شد.')}catch(e){show('ارسال API انجام نشد: '+e.message,false)}}
nav();
</script></body></html>

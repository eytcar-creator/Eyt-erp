openapi: 3.0.3
info:
  title: E.Y.T ERP Integration API
  version: 1.0.0
  description: Unified API contract for E.Y.T catalog, B2B ordering, ERP integrations and n8n.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        '200':
          description: Service health
  /catalog/products:
    get:
      summary: Search products
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: vehicle_model_id, in: query, schema: {type: string, format: uuid}}
        - {name: category_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Product list}
  /catalog/fitments:
    get:
      summary: Find products by vehicle fitment
      parameters:
        - {name: vehicle_model_id, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Fitment results}
  /b2b/orders:
    post:
      summary: Submit a B2B order request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B2BOrderRequest'
      responses:
        '201': {description: Order request created}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '409': {description: Duplicate external reference}
  /inventory/availability:
    get:
      summary: Check available stock
      parameters:
        - {name: product_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: warehouse_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Availability result}
  /webhooks/events:
    post:
      summary: Receive validated integration events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '202': {description: Event accepted}
        '400': {description: Invalid event}
        '401': {description: Unauthorized}
        '409': {description: Duplicate event}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    B2BOrderRequest:
      type: object
      required: [customer_id, channel, items]
      properties:
        customer_id: {type: string, format: uuid}
        channel: {type: string, enum: [WEB, API, WHATSAPP, PHONE, OTHER]}
        external_reference: {type: string, maxLength: 150}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: {type: string, format: uuid}
              quantity: {type: number, exclusiveMinimum: 0}
              requested_unit_price: {type: number, minimum: 0}
    EventEnvelope:
      type: object
      required: [event_id, event_type, occurred_at, payload]
      properties:
        event_id: {type: string, format: uuid}
        event_type: {type: string}
        occurred_at: {type: string, format: date-time}
        correlation_id: {type: string, format: uuid}
        payload: {type: object, additionalProperties: true}
